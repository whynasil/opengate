[gateway]
host = "127.0.0.1"
port = 9378
auth_token = "${OPENGATE_AUTH_TOKEN}"

[[models]]
id = "openai/gpt-5.2"
provider = "openai"
api_key = "${OPENAI_API_KEY}"
base_url = "https://api.openai.com/v1"
default = true

[[models]]
id = "anthropic/claude-sonnet-4"
provider = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"

[[models]]
id = "ollama/llama3.1"
provider = "ollama"
base_url = "http://localhost:11434"

[channels.telegram]
bot_token = "${TELEGRAM_BOT_TOKEN}"
allowed_users = []

[workspace]
path = "~/.opengate"
