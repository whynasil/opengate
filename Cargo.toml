[package]
name = "opengate"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-Performance AI Agent Gateway in Rust"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
toml = "0.8"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
# Database
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
# Telegram
teloxide = { version = "0.14", features = ["rustls"], default-features = false }
# Browser (CDP)
chromiumoxide = "0.8"
# TUI
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
# Crypto
ring = "0.17"
sha2 = "0.10"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Error handling
thiserror = "2"
anyhow = "1"
# Async utilities
futures = "0.3"
tokio-stream = "0.1"
# UUID
uuid = { version = "1", features = ["v4"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# WebSocket client (for TUI)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
