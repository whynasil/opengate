name: Musl Static Build

on:
  push:
    branches: [main]

jobs:
  build-musl:
    name: musl static build (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Verify static binary
        run: |
          ldd target/x86_64-unknown-linux-musl/release/opengate || true
          file target/x86_64-unknown-linux-musl/release/opengate
      - name: Build Docker image
        run: docker build -f Dockerfile.musl -t opengate:musl .
      - uses: actions/upload-artifact@v4
        with:
          name: opengate-linux-musl
          path: target/x86_64-unknown-linux-musl/release/opengate
